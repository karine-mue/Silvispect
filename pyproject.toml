[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silvispect"
version = "0.1.1"
description = "Inspect forest canopy height models and field inventories, and report coded findings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Silvispect contributors" }]
keywords = [
    "forestry",
    "remote-sensing",
    "canopy-height-model",
    "tree-detection",
    "forest-inventory",
    "lidar",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/karine-mue/Silvispect"
Source = "https://github.com/karine-mue/Silvispect"
Issues = "https://github.com/karine-mue/Silvispect/issues"

[project.scripts]
silvispect = "silvispect.cli:main"

[project.optional-dependencies]
# ruff is pinned to a minor series: it is a formatter as well as a linter,
# and formatting rules change between minor releases, which would otherwise
# turn an unrelated ruff release into a red CI run.
dev = ["pytest>=7", "ruff>=0.16.3,<0.17", "mypy>=1.11"]

[tool.setuptools]
packages = ["silvispect"]

[tool.setuptools.package-data]
# PEP 561 marker: the package ships inline type annotations.
silvispect = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # long lines are handled by the formatter, not the linter
    "SIM108", # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
