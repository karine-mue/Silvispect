name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Smoke-test the CLI on the sample plot
        run: |
          silvispect --version
          silvispect demo
          silvispect render data/plot-a1-chm.asc --width 60
          silvispect inspect --chm data/plot-a1-chm.asc \
                             --inventory data/plot-a1-trees.csv \
                             --format json -o report.json
          python -c "import json; json.load(open('report.json'))"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Type check
        run: mypy silvispect

  package:
    name: Distributions are installable and testable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel and the source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel and exercise the CLI
        run: |
          python -m pip install dist/*.whl
          silvispect --version
          silvispect demo > /dev/null
          # From a neutral directory, so the checkout does not shadow the wheel.
          cd /tmp && python -c "import silvispect, importlib.resources as r; \
              assert 'site-packages' in silvispect.__file__, silvispect.__file__; \
              assert (r.files('silvispect') / 'py.typed').is_file(), 'missing py.typed'"

      - name: Run the suite from the unpacked source distribution
        run: |
          python -m pip install pytest
          mkdir -p /tmp/sdist && tar xf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && pytest -q

  sample-data:
    name: Sample data is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Regenerate and diff
        run: |
          python scripts/make_sample_data.py
          git diff --exit-code -- data/
